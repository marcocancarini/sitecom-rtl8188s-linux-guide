# DKMS configuration for the r8712u out-of-tree driver.
# Copy the driver source tree to /usr/src/r8712u-<kernel-version>/ together
# with this file, then:
#   dkms add -m r8712u -v <kernel-version>
#   dkms build -m r8712u -v <kernel-version> -k $(uname -r)
#   dkms install -m r8712u -v <kernel-version> -k $(uname -r)
PACKAGE_NAME="r8712u"
PACKAGE_VERSION="6.1"
BUILT_MODULE_NAME[0]="r8712u"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_R8712U=m modules"
AUTOINSTALL="yes"
